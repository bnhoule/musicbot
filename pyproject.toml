[project]
name = "musicbot"
version = "0.1.0"
description = "Automated music remix preparation: stem splitting, kick detection, trimming, rekeying, stacking"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# "." lets tests import musicbot.*; "musicbot" lets internal absolute imports
# (e.g. stack_engine's `from processing.rekey import ...`) resolve.
pythonpath = [".", "musicbot"]
testpaths = ["tests"]
markers = [
    "unit: pure-logic tests, no audio, milliseconds",
    "synthetic: generated-audio DSP tests, seconds",
    "benchmark: real-audio ear benchmark against hand labels (LFS fixtures)",
]
addopts = "-ra"

[tool.coverage.run]
# Gate coverage on the DSP core only — the web server and one-off CLI
# tools are exercised manually, not by the test suite.
include = [
    "musicbot/processing/*",
    "musicbot/utils.py",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [
    "musicbot/web/frontend",
    "visual_scraper.py",
    "full_auto_scraper.py",
    "multi_section_scraper.py",
]

[tool.ruff.lint]
# Pycodestyle errors + pyflakes + bugbear + comprehensions + pyupgrade +
# simplify — the rule families that catch real bugs, not style churn.
select = ["E4", "E7", "E9", "F", "B", "C4", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `File(...)` in parameter defaults is the framework idiom
"musicbot/web/server.py" = ["B008"]
