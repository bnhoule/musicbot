name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: ruff lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: unit + synthetic tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install system audio deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rubberband-cli libsndfile1
      - run: pip install -r requirements-ci.txt
      - name: Run tests with coverage gate on the DSP core
        run: >
          pytest tests/unit tests/synthetic -q
          --cov --cov-report=term --cov-fail-under=50

  benchmark:
    name: ear benchmark (kick + BPM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # LFS off here — fixtures are only pulled if the fast-path check
      # below decides the benchmark actually needs to run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Fast path — skip benchmark when no audio code changed
        id: relevant
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On PR events HEAD is the merge commit; HEAD^1 is the base branch.
          CHANGED=$(git diff --name-only HEAD^1 HEAD)
          echo "$CHANGED"
          PATTERN='^(musicbot/(processing|tools|backends)/|musicbot/utils|musicbot/process_song|tests/|data/|requirements|pyproject|\.github/workflows/ci)'
          if echo "$CHANGED" | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No audio-relevant changes — benchmark passes trivially."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull LFS fixtures
        if: steps.relevant.outputs.run == 'true'
        run: git lfs pull
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.relevant.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install system audio deps
        if: steps.relevant.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg
      - name: Install Python deps (madmom needs Cython + numpy first)
        if: steps.relevant.outputs.run == 'true'
        run: |
          pip install -r requirements-ci.txt
          # madmom builds from source with --no-build-isolation, so its build
          # deps (setuptools/wheel/Cython, numpy from requirements) must be
          # present in the environment first.
          pip install setuptools wheel Cython
          pip install --no-build-isolation "madmom @ git+https://github.com/CPJKU/madmom"
      - name: Run benchmark
        if: steps.relevant.outputs.run == 'true'
        run: pytest tests/benchmark -q -s
